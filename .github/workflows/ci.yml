# Every push to main and every pull request (Dependabot's included): the same
# checks as "done" means locally — typecheck, lint, tests, build — plus the
# addon simulation and the release's package, made by the BigWigs packager as
# release.yml makes it (the companion app is Ravenpost, in its own repo).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wowlocker
          POSTGRES_PASSWORD: wowlocker
          POSTGRES_DB: wowlocker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wowlocker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HUSKY: "0"
      TEST_DATABASE_URL: postgres://wowlocker:wowlocker@localhost:5432/wowlocker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: MIGRATE_URL="$TEST_DATABASE_URL" bun run db:migrate
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get install -y -qq luajit
      - run: luajit addon/test/sim.lua
      # The release's package (release.yml), made without publishing: the
      # addon's folder, nothing more or less.
      - run: echo "(CI)" > .release-notes.md
      - uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2.6.1
        with:
          args: -d -u
          pandoc: false
      - run: diff -r addon/WowLocker .release/WowLocker
