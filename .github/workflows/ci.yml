# Every push to main and every pull request (Dependabot's included): the same
# checks as "done" means locally — typecheck, lint, tests, build — plus the
# addon simulation and the release's package, made by the BigWigs packager as
# release.yml makes it (the companion app is Ravenpost, in its own repo).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y -qq luajit
      - run: luajit addon/test/sim.lua
      # The release's package (release.yml), made without publishing: the
      # addon's folder, nothing more or less.
      - run: echo "(CI)" > .release-notes.md
      - uses: BigWigsMods/packager@v2.6.1
        with:
          args: -d -u
          pandoc: false
      - run: diff -r addon/WowLocker .release/WowLocker
