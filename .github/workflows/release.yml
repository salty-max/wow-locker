# Pushing a tag vX.Y.Z (scripts/release.sh does it) publishes a release:
# builds the companion (macOS universal .app + Windows x64/arm64 .exe) and the
# addon zip, creates the GitHub release with the tag's message as its notes,
# then uploads the addon to CurseForge when its version changed. The site
# itself deploys from main on Vercel.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # checkout leaves the tag lightweight: fetch it again for its message.
      - run: git fetch --force --tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: companion/go.mod
          cache-dependency-path: companion/go.sum
      - name: Build
        run: WOWLOCKER_SERVER=https://wow-locker.app companion/scripts/build.sh
      - name: Publish the release
        run: |
          git tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN PGP SIGNATURE-----/,$d' > notes.md
          [ -s notes.md ] || { echo "::error::tag $TAG has no message (release notes)"; exit 1; }
          gh release create "$TAG" --title "$TAG" --notes-file notes.md companion/dist/*

  curseforge:
    needs: build
    uses: ./.github/workflows/curseforge.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
