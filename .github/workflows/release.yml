# Pushing a tag vX.Y.Z (scripts/release.sh does it) publishes a release:
# zips the addon, creates the GitHub release with the tag's message as its notes,
# then uploads the addon to CurseForge when its version changed. The site
# itself deploys from main on Vercel.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # checkout leaves the tag lightweight: fetch it again for its message.
      - run: git fetch --force --tags
      # The companion app is Ravenpost (salty-max/ravenpost), released there.
      - name: Build
        run: mkdir -p dist && (cd addon && zip -qr ../dist/WowLocker-addon.zip WowLocker -x '*.DS_Store')
      - name: Publish the release
        run: |
          git tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN PGP SIGNATURE-----/,$d' > notes.md
          [ -s notes.md ] || { echo "::error::tag $TAG has no message (release notes)"; exit 1; }
          gh release create "$TAG" --title "$TAG" --notes-file notes.md dist/*

  curseforge:
    needs: build
    uses: ./.github/workflows/curseforge.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
