# Publishes the addon on CurseForge when a GitHub release is published (the
# release is made by hand with companion/scripts/build.sh's files), but only
# if the addon's version changed since the previous release: companion-only
# releases don't upload the same addon again. Run it by hand to force one.
#
# Needs: repository variable CURSEFORGE_PROJECT_ID, secret CURSEFORGE_TOKEN.
name: CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload (uploads even if the addon didn't change)
        required: true

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    if: ${{ vars.CURSEFORGE_PROJECT_ID != '' }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The default branch (for the upload script, which older tags don't have);
      # the tag's own files are read with git show.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did the addon change?
        id: changed
        run: |
          version() { sed -n 's/^## Version: *//p' | tr -d '\r'; }
          now=$(git show "$TAG:addon/WowLocker/WowLocker.toc" | version)
          # The release just before this one (tags newest first).
          prev_tag=$(git tag --sort=-creatordate | sed -n "/^$TAG\$/{n;p;q;}")
          prev=$( [ -n "$prev_tag" ] && git show "$prev_tag:addon/WowLocker/WowLocker.toc" 2>/dev/null | version || true)
          echo "addon $now (previous release $prev_tag: ${prev:-none})"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$now" != "$prev" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the release's addon zip and notes
        if: steps.changed.outputs.upload == 'true'
        run: |
          gh release download "$TAG" --pattern WowLocker-addon.zip --dir out
          gh release view "$TAG" --json body --jq .body > out/changelog.md

      - name: Upload to CurseForge
        if: steps.changed.outputs.upload == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        run: scripts/curseforge-upload.sh out/WowLocker-addon.zip out/changelog.md
